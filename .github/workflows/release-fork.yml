name: Release (fork)

# Deliberately NOT triggered by `push: tags`. A tag pushed with the default
# GITHUB_TOKEN cannot start another workflow run, so a tag trigger would look
# correct and never fire. sync-upstream.yml calls this via workflow_call.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.288.4'
        required: true
        type: string
      ref:
        description: 'Tag or sha to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.288.4'
        required: true
        type: string
      ref:
        description: 'Tag or sha to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      # FileVersion and Version are set alongside AssemblyVersion so the
      # apphost carries readable Win32 version info. AssemblyVersion is the
      # one the in-app updater compares; the others only make the exe's file
      # properties agree with it, and give the check below something to read.
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained -p:AssemblyVersion=${{ inputs.version }} -p:FileVersion=${{ inputs.version }} -p:Version=${{ inputs.version }}

    - name: Confirm the built exe carries the injected version
      shell: pwsh
      run: |
        # PublishSingleFile produces a native apphost bundle, not a managed
        # PE, so [Reflection.AssemblyName]::GetAssemblyName throws
        # "PE image does not have metadata" here. Read the Win32 version
        # resource instead, which the apphost does carry.
        $exe = "app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe"
        if (-not (Test-Path $exe)) { throw "Publish produced no exe at $exe" }
        $expected = [version]"${{ inputs.version }}"
        $raw = (Get-Item $exe).VersionInfo.FileVersion
        Write-Host "exe FileVersion: $raw / expected: $expected"
        if (-not $raw) { throw "exe carries no FileVersion; the -p: overrides did not take" }
        $actual = [version]($raw -split '\+')[0]
        if ($actual.Major -ne $expected.Major -or $actual.Minor -ne $expected.Minor -or $actual.Build -ne $expected.Build) {
          throw "exe is $actual but should be $expected; the -p: version overrides did not take"
        }

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe -DestinationPath GHelper.zip -Force

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        # Pin the target repo. gh otherwise infers it from git remotes and
        # prefers one named `upstream`, which would publish to the wrong repo.
        GH_REPO: ${{ github.repository }}
      shell: pwsh
      run: |
        # Not --draft and not --prerelease: releases/latest, which the in-app
        # updater reads, excludes both.
        gh release create "v${{ inputs.version }}" `
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe `
          GHelper.zip `
          --title "G-Helper ${{ inputs.version }} (fork)" `
          --notes "Unsigned fork build of upstream + local changes. SmartScreen will warn on first launch." `
          --target "${{ inputs.ref }}" `
          --latest
